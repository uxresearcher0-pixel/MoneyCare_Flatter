name: Build release APK and AAB

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/money-management-flutter-app-jdir9k

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # RELEASE_* secrets are optional: unset, the release build falls back
      # to debug signing (see android/app/build.gradle.kts) so this workflow
      # keeps working before the user adds them — it just won't produce a
      # Play-submittable signature until they do.
      # --no-tree-shake-icons: Firestore-backed custom fields/categories/etc.
      # reconstruct IconData from a stored codePoint at runtime (icons the
      # user picks aren't known at compile time), which Flutter's default
      # icon-font tree-shaker can't prove safe and refuses to build with a
      # hard error. Ships the full Material icon font (~2MB) instead.
      - run: flutter build apk --release --no-tree-shake-icons
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      # Google Play requires an .aab (App Bundle) for new app submissions —
      # the .apk above is kept for direct-install/testing convenience only.
      - run: flutter build appbundle --release --no-tree-shake-icons
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: money-care-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: money-care-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
